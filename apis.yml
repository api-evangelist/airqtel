x-domain-note: >-
  airqtel.com is the domain AirQtel published in its own 2025-02-23 Series A release
  (website www.airqtel.com, media contact @airqtel.com). On 2026-09-19 airqtel.com and
  www.airqtel.com return NXDOMAIN from 1.1.1.1, 8.8.8.8 and 9.9.9.9 (no A, NS or MX), and
  Verisign's .com RDAP answers 404 for the name while answering 200 for a control domain, so the
  registration itself has lapsed rather than the site going dark. The Wayback Machine holds a
  live Squarespace site through 2025-12-27. No shutdown, acquisition or rebrand announcement
  was found, so the company's operating status is unknown and it is NOT marked defunct; no
  Website pointer is wired because no host the company controls currently answers, and the
  Nasdaq Private Market listing the harvest stub carried is a trading venue, not the company.
