aid: airqtel
name: AirQtel
description: >-
  AirQtel is a Wellesley, Massachusetts aerial surveillance operator founded in 2021 by Vin
  Loccisano. It sells ultra-high-resolution real-time aerial imaging as a service, flown from
  its own fleet of manned aircraft and remotely piloted hardware carrying its proprietary
  "Looking-Glass" imaging systems, to military, government and commercial customers, and
  announced a $27M Series A in February 2025 following a prototype launch of the Looking Glass
  aerial network across four countries. Its only published domain, airqtel.com, hosted a
  three-page Squarespace brochure site (Home, About, Partner Portal login) with no developer
  program, API, SDK or machine-readable contract of any kind, and as of 2026-09-19 that domain
  is no longer registered (NXDOMAIN at every public resolver; Verisign RDAP 404).
